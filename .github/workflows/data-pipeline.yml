name: Data pipeline

# The Italian registries (MUR open data, Universitaly/Cineca) block requests
# from some networks. This workflow runs the pipeline from GitHub's runners:
# probe first; when reachable, the same workflow is the scheduled ingestion
# runner — no extra hosting needed.

on:
  schedule:
    - cron: "0 3 1 * *"   # monthly refresh of the Universitaly catalog
  workflow_dispatch:
    inputs:
      task:
        description: "probe | mur | universitaly-sample | universitaly-api | universitaly-har | universitaly-ingest | verify-access | almalaurea-probe | almalaurea-discover | almalaurea-sample | almalaurea-ingest | almalaurea-labels | almalaurea-all"
        required: false
        default: "probe"
      pages:
        description: "max pages for universitaly-ingest (empty = all)"
        required: false
        default: ""

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt psycopg2-binary

      - name: Probe registries
        run: |
          echo "runner egress IP: $(curl -s -m 10 https://api.ipify.org || echo unknown)"
          for url in \
            "https://dati-ustat.mur.gov.it/" \
            "https://dati-ustat.mur.gov.it/api/3/action/package_search?q=offerta+formativa&rows=1" \
            "https://www.universitaly.it/" \
            "https://www.universitaly.it/cerca-corsi" \
            "https://universitaly-backend.cineca.it/" ; do
            code=$(curl -s -L -m 25 -o /tmp/last_probe -w "%{http_code}" "$url" || echo "FAIL")
            size=$(wc -c < /tmp/last_probe 2>/dev/null || echo 0)
            echo "PROBE $code ${size}b $url"
          done

      - name: AlmaLaurea ingest (real outcomes)
        if: startsWith(inputs.task, 'almalaurea-') && inputs.task != 'almalaurea-probe' && inputs.task != 'almalaurea-discover'
        working-directory: pipeline
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
          python -m careercompass_pipeline.adapters.almalaurea ${{ inputs.task == 'almalaurea-sample' && 'sample' || inputs.task == 'almalaurea-labels' && 'labels' || 'ingest' }}

      - name: Upload AlmaLaurea data
        if: startsWith(inputs.task, 'almalaurea-') && inputs.task != 'almalaurea-probe' && inputs.task != 'almalaurea-discover'
        uses: actions/upload-artifact@v4
        with:
          name: almalaurea-data
          path: |
            pipeline/out/almalaurea.json
            /tmp/aldump/labels_*.txt

      - name: AlmaLaurea discovery (headless browser)
        if: inputs.task == 'almalaurea-discover'
        working-directory: pipeline
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
          python -m careercompass_pipeline.adapters.almalaurea discover

      - name: AlmaLaurea reachability + shape probe
        if: inputs.task == 'almalaurea-probe'
        run: |
          mkdir -p /tmp/aldump
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for url in \
            "https://www2.almalaurea.it/cgi-php/universita/statistiche/tendine.php?config=occupazione" \
            "https://statistiche.almalaurea.it/cgi-php/universita/statistiche/occupazione.php" \
            "https://www2.almalaurea.it/cgi-php/universita/statistiche/tendine.php?config=profilo" ; do
            code=$(curl -s -L -m 40 -A "$UA" -o /tmp/aldump/page.html -w "%{http_code}" "$url" || echo FAIL)
            echo "PROBE $code $(wc -c < /tmp/aldump/page.html)b $url"
            cp /tmp/aldump/page.html "/tmp/aldump/$(echo $url | md5sum | cut -c1-8).html"
          done
          echo "--- university codes found in dropdowns ---"
          grep -o 'value="[0-9]\{4,5\}"[^>]*>[^<]\{0,45\}' /tmp/aldump/*.html | head -30 || true
          echo "--- degree-class options ---"
          grep -o 'name="classe"' -A2 /tmp/aldump/*.html | head -5 || true

      - name: Verify admission access types
        if: inputs.task == 'verify-access'
        working-directory: pipeline
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
          python -m careercompass_pipeline.verify_access

      - name: Universitaly full-catalog ingest
        if: inputs.task == 'universitaly-ingest' || github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: pipeline
        run: python main.py ingest universitaly ${{ inputs.pages || '' }}

      - name: MUR discovery + ingest
        if: inputs.task == 'mur'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: pipeline
        run: python main.py ingest mur

      - name: Universitaly sample dump
        if: inputs.task == 'universitaly-sample'
        run: |
          mkdir -p /tmp/unidump
          curl -s -L -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36" \
            "https://www.universitaly.it/cerca-corsi" -o /tmp/unidump/cerca-corsi.html -w "cerca-corsi %{http_code}\n" || true
          curl -s -L -m 30 "https://dati-ustat.mur.gov.it/api/3/action/package_search?q=offerta+formativa&rows=10" \
            -o /tmp/unidump/mur-packages.json -w "mur-packages %{http_code}\n" || true
          ls -la /tmp/unidump

      - name: Universitaly API discovery
        if: inputs.task == 'universitaly-api'
        run: |
          mkdir -p /tmp/unidump
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -s -L -m 30 -A "$UA" "https://www.universitaly.it/cerca-corsi" -o /tmp/page.html
          # download every nuxt chunk and mine it for backend API paths
          grep -o '/_nuxt/[A-Za-z0-9_.-]*\.js' /tmp/page.html | sort -u > /tmp/chunks.txt
          wc -l /tmp/chunks.txt
          : > /tmp/unidump/api-paths.txt
          while read -r chunk; do
            curl -s -m 30 -A "$UA" "https://www.universitaly.it$chunk" -o /tmp/chunk.js || continue
            grep -o -E '"/[a-zA-Z0-9_/${}.-]{3,80}"' /tmp/chunk.js | sort -u >> /tmp/unidump/api-paths.txt || true
            grep -o -E 'universitaly-backend[^"]{0,120}' /tmp/chunk.js >> /tmp/unidump/api-paths.txt || true
          done < /tmp/chunks.txt
          sort -u /tmp/unidump/api-paths.txt -o /tmp/unidump/api-paths.txt
          wc -l /tmp/unidump/api-paths.txt
          # blind-try a few likely endpoints
          for p in "/api/corsi/search?page=0&size=2" "/api/corsi?page=0&size=2" "/cs/search?page=0" "/api/search/corsi?anno=2025"; do
            code=$(curl -s -m 20 -A "$UA" -o /tmp/try.json -w "%{http_code}" "https://universitaly-backend.cineca.it$p" || echo FAIL)
            echo "TRY $code $p" | tee -a /tmp/unidump/tries.txt
            head -c 300 /tmp/try.json >> /tmp/unidump/tries.txt || true
            echo "" >> /tmp/unidump/tries.txt
          done

      - name: Universitaly network capture (headless browser)
        if: inputs.task == 'universitaly-har'
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
          mkdir -p /tmp/unidump
          python - << 'EOF'
          import json, asyncio
          from playwright.async_api import async_playwright

          async def main():
              calls = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()

                  async def on_response(resp):
                      url = resp.url
                      if "cineca.it" in url or "/api/" in url:
                          entry = {"url": url, "status": resp.status}
                          try:
                              body = await resp.text()
                              entry["body_head"] = body[:1200]
                          except Exception:
                              pass
                          calls.append(entry)

                  page.on("response", on_response)
                  try:
                      await page.goto("https://www.universitaly.it/cerca-corsi", wait_until="domcontentloaded", timeout=45000)
                      await page.wait_for_timeout(9000)
                      try:
                          box = page.locator("input").first
                          await box.fill("ingegneria informatica")
                          await page.keyboard.press("Enter")
                          await page.wait_for_timeout(9000)
                      except Exception as e:
                          calls.append({"note": f"search interaction failed: {e}"})
                  except Exception as e:
                      calls.append({"note": f"goto failed: {e}"})
                  await browser.close()
              with open("/tmp/unidump/network-calls.json", "w") as f:
                  json.dump(calls, f, indent=1)
              print(f"captured {len(calls)} backend calls")
          asyncio.run(main())
          EOF

      - uses: actions/upload-artifact@v4
        if: inputs.task == 'universitaly-sample' || inputs.task == 'universitaly-api' || inputs.task == 'universitaly-har' || inputs.task == 'almalaurea-probe' || inputs.task == 'almalaurea-discover'
        with:
          name: registry-dump
          path: |
            /tmp/unidump
            /tmp/aldump

  # The national pass: every AlmaLaurea university, split across shards so it
  # finishes in minutes instead of hours. Runs only for task=almalaurea-all.
  almalaurea-national:
    if: inputs.task == 'almalaurea-all'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r pipeline/requirements.txt playwright && python -m playwright install chromium --with-deps
      - name: Ingest shard ${{ matrix.shard }}
        working-directory: pipeline
        run: python -m careercompass_pipeline.adapters.almalaurea all ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        with:
          name: almalaurea-national-${{ matrix.shard }}
          path: pipeline/out/almalaurea-shard-*.json
