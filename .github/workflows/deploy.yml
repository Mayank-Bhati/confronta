# Deploys the Next.js static export to GitHub Pages on every push to main.
#
# First-principles note: actions/configure-pages with
# `static_site_generator: next` auto-injects the correct basePath
# (e.g. /confronta) into next.config at build time, so asset URLs
# resolve under https://<user>.github.io/<repo>/ without hardcoding.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages (injects basePath for Next)
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - run: npm ci

      - run: npm run build

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
